name: Marée

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - id: mois
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: cache
          key: harmoniques-${{ steps.mois.outputs.m }}
          restore-keys: harmoniques-
      - run: python update.py
      - run: cp index.html config.json icone.png site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
